server:
  servlet:
    context-path: /api
  port: 9090

spring:
  # 本地私有配置（数据库密码等）放 application-local.yml，该文件已加入 .gitignore 不会上传。
  # 仓库里提供的是 application-local.yml.example，复制一份填上自己的密码即可。
  config:
    import: optional:classpath:application-local.yml
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 35MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/ciyuan_xiaowo?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
    username: root
    password: ${DB_PASSWORD:}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

sa-token:
  token-name: satoken
  timeout: 2592000
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true

